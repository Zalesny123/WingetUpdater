name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned PowerShell modules
        run: |
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -ErrorAction Stop
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize
              throw 'PSScriptAnalyzer found issues.'
          }

      - name: Run Pester tests
        run: |
          Import-Module Pester -RequiredVersion 6.0.1 -Force -ErrorAction Stop
          $config = [PesterConfiguration]::Default
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  package:
    name: Validate tag and package release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag and version consistency
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') {
              throw "Release tag is not strict Semantic Versioning: $tag"
          }
          $tagType = (git cat-file -t $tag).Trim()
          if ($tagType -ne 'tag') {
              throw "Release tag must be annotated; object type was '$tagType'."
          }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
              throw 'The checked-out commit does not match the annotated release tag.'
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to fetch origin/main for release ancestry verification.'
          }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
              throw 'The release tag commit is not reachable from origin/main.'
          }

          $version = $tag.Substring(1)
          $escapedVersion = [regex]::Escape($version)
          $readme = Get-Content -LiteralPath README.md -Raw
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $application = Get-Content -LiteralPath WingetUpdater.ps1 -Raw
          if ($readme -notmatch "(?m)^\*\*Version:\*\*\s+$escapedVersion\s*$" -or
              $changelog -notmatch "(?m)^## \[$escapedVersion\] - \d{4}-\d{2}-\d{2}\s*$" -or
              $application -notmatch "Wersja $escapedVersion") {
              throw "README, CHANGELOG, application, and tag versions are not all $version."
          }

      - name: Build and verify release archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $zipName = "WingetUpdater-$tag.zip"

          $files = @(
              'Start.bat',
              'WingetUpdater.ps1',
              'WingetUpdater.Core.psm1',
              'README.md',
              'CHANGELOG.md',
              'LICENSE'
          )
          foreach ($file in $files) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Missing required release file: $file"
              }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $commitEpoch = [long]((git show -s --format=%ct HEAD).Trim())
          $releaseTimestamp = [DateTimeOffset]::FromUnixTimeSeconds($commitEpoch)
          $zipPath = Join-Path (Get-Location) $zipName
          $zipStream = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try {
              $archive = New-Object System.IO.Compression.ZipArchive($zipStream, [System.IO.Compression.ZipArchiveMode]::Create, $false)
              try {
                  foreach ($file in @($files | Sort-Object)) {
                      $entry = $archive.CreateEntry($file, [System.IO.Compression.CompressionLevel]::Optimal)
                      $entry.LastWriteTime = $releaseTimestamp
                      $sourceStream = [System.IO.File]::OpenRead((Resolve-Path $file).Path)
                      try {
                          $entryStream = $entry.Open()
                          try {
                              $sourceStream.CopyTo($entryStream)
                          }
                          finally {
                              $entryStream.Dispose()
                          }
                      }
                      finally {
                          $sourceStream.Dispose()
                      }
                  }
              }
              finally {
                  $archive.Dispose()
              }
          }
          finally {
              $zipStream.Dispose()
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipName))
          try {
              $entries = @($archive.Entries | Where-Object { $_.Name } | ForEach-Object FullName | Sort-Object)
          }
          finally {
              $archive.Dispose()
          }
          $expected = @($files | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $entries).Count -gt 0) {
              throw "Unexpected release archive entries: $($entries -join ', ')"
          }

          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('SHA256SUMS', "$hash  $zipName`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            WingetUpdater-*.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Verify downloaded checksum
        shell: pwsh
        run: |
          $line = (Get-Content -LiteralPath release/SHA256SUMS -Raw).Trim()
          $parts = $line -split '\s+', 2
          if ($parts.Count -ne 2) { throw 'Invalid SHA256SUMS format.' }
          $zipPath = Join-Path release $parts[1]
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0]) { throw 'Downloaded release bundle checksum mismatch.' }

      - name: Inspect existing release
        id: release-state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $expectedZip = "WingetUpdater-$env:RELEASE_TAG.zip"
          $release = $null
          $apiErrorPath = Join-Path $env:RUNNER_TEMP "release-api-$([guid]::NewGuid().ToString('N')).txt"
          $releaseJson = gh api "repos/$env:REPOSITORY/releases/tags/$env:RELEASE_TAG" 2> $apiErrorPath
          $apiExitCode = $LASTEXITCODE

          if ($apiExitCode -eq 0) {
              $release = ConvertFrom-Json -InputObject ($releaseJson -join "`n") -ErrorAction Stop
          }
          else {
              $apiError = if (Test-Path -LiteralPath $apiErrorPath) {
                  [System.IO.File]::ReadAllText($apiErrorPath)
              }
              else {
                  ''
              }
              if ($apiError -notmatch '(?i)Not Found' -or $apiError -notmatch '(?i)HTTP 404') {
                  throw "Unable to inspect release '$env:RELEASE_TAG': $apiError"
              }

              # The tag endpoint exposes only published releases, so scan authenticated listings for drafts.
              $listErrorPath = Join-Path $env:RUNNER_TEMP "release-list-$([guid]::NewGuid().ToString('N')).txt"
              $releasePagesJson = gh api --paginate --slurp "repos/$env:REPOSITORY/releases?per_page=100" 2> $listErrorPath
              if ($LASTEXITCODE -ne 0) {
                  $listError = if (Test-Path -LiteralPath $listErrorPath) {
                      [System.IO.File]::ReadAllText($listErrorPath)
                  }
                  else {
                      ''
                  }
                  throw "Unable to inspect draft releases: $listError"
              }

              $releasePages = ConvertFrom-Json -InputObject ($releasePagesJson -join "`n") -ErrorAction Stop
              $matchingReleases = @(
                  foreach ($page in @($releasePages)) {
                      foreach ($candidate in @($page)) {
                          if ($candidate.tag_name -ceq $env:RELEASE_TAG) {
                              $candidate
                          }
                      }
                  }
              )
              $release = $matchingReleases |
                  Sort-Object @{ Expression = { [int]$_.draft } }, id |
                  Select-Object -First 1
          }

          if ($null -eq $release) {
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'state=missing'
              return
          }
          if ($release.draft -eq $true) {
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'state=draft'
              return
          }

          $expectedNames = @('SHA256SUMS', $expectedZip) | Sort-Object
          $releaseAssetNames = @($release.assets | ForEach-Object name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $releaseAssetNames).Count -ne 0) {
              throw "Published release has unexpected assets: $($releaseAssetNames -join ', ')"
          }

          $verificationDirectory = Join-Path $env:RUNNER_TEMP "published-release-$([guid]::NewGuid().ToString('N'))"
          [void](New-Item -ItemType Directory -Path $verificationDirectory)
          gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --dir $verificationDirectory --clobber --pattern 'SHA256SUMS' --pattern $expectedZip
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to download published release assets for verification.'
          }

          $downloadedNames = @(Get-ChildItem -LiteralPath $verificationDirectory -File | ForEach-Object Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $downloadedNames).Count -ne 0) {
              throw "Downloaded release has unexpected assets: $($downloadedNames -join ', ')"
          }

          $checksumPath = Join-Path $verificationDirectory 'SHA256SUMS'
          $checksumText = [System.IO.File]::ReadAllText($checksumPath)
          $checksumMatch = [regex]::Match($checksumText, '\A(?<hash>[0-9a-fA-F]{64})  (?<filename>[^\r\n]+)\r?\n?\z')
          if (-not $checksumMatch.Success) {
              throw 'Published SHA256SUMS has an invalid format.'
          }
          if ($checksumMatch.Groups['filename'].Value -cne $expectedZip) {
              throw 'Published SHA256SUMS names an unexpected archive.'
          }

          $publishedZipPath = Join-Path $verificationDirectory $expectedZip
          $expectedHash = $checksumMatch.Groups['hash'].Value.ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $publishedZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw 'Published release archive checksum mismatch.'
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'state=published'

      - name: Attest release artifacts
        if: steps.release-state.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/WingetUpdater-*.zip
            release/SHA256SUMS

      - name: Upload draft release assets
        if: steps.release-state.outputs.state != 'published'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/WingetUpdater-*.zip
            release/SHA256SUMS
          draft: true
          prerelease: false
          generate_release_notes: ${{ steps.release-state.outputs.state == 'missing' }}
          fail_on_unmatched_files: true

      - name: Publish immutable GitHub Release
        if: steps.release-state.outputs.state != 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:REPOSITORY --draft=false --latest
